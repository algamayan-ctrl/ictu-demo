expose_php=Off
display_errors=Off
log_errors=On
memory_limit=256M
# The Laravel upload policy is configurable by ICTU up to 64 MB per file.
# Allow two protected supporting documents plus multipart form data to reach
# Laravel, where the configured per-file policy is enforced.
upload_max_filesize=64M
post_max_size=128M
max_execution_time=60
session.cookie_httponly=1
session.cookie_samesite=Lax
opcache.enable=1
opcache.validate_timestamps=0
